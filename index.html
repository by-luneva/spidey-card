<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spidey Card</title>
    
    <!-- Open Graph / Social Media Thumbnail Meta Tags -->
    <meta property="og:title" content="Spidey Card">

    <!-- Twitter Card Meta Tags -->

    <meta name="twitter:image" content="https://by-luneva.github.io/spidey-card/thumbnail.png">

    <style>
        /* === 1. CONFIGURATION VARIABLES === */
        :root {
            --songs-top: 15%; --songs-left: 42%; --songs-width: 40%; --songs-gap: -38px;
            --bar-width: 87%; --bar-height: 48px; --bar-margin-top: -57px; --bar-offset-x: 9px; --bar-btn: 24px; --bar-gap: 8px;
            --letter-top: 31%; --letter-left: 29%; --letter-width: 65%; --letter-height: 100%; --letter-size: 0.48rem; --letter-line: 1.2;
        }

        /* === 2. GLOBAL STYLES === */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: 'Georgia', serif; position: relative; }
        #magic-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; will-change: transform; opacity: 0.35; }

        /* === 3. LOADING SCREEN === */
        #loading-screen { position: fixed; inset: 0; background: #000; z-index: 999999; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s ease, visibility 0.8s ease; }
        #loading-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-content { display: flex; flex-direction: column; align-items: center; text-align: center; width: 260px; transform-origin: center center; }
        .loader-spinner { width: 36px; height: 36px; border: 2.5px solid rgba(255,255,255,0.15); border-top: 2.5px solid #fff; border-radius: 50%; animation: spinLoader 1s linear infinite; margin-bottom: 14px; }
        .loader-text { color: #f1f5f9; font-size: 0.8rem; letter-spacing: 3px; text-transform: lowercase; text-shadow: 0 0 10px rgba(56,189,248,0.4); margin-bottom: 10px; }
        .loader-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; margin-top: 4px; }
        .loader-bar { width: 0%; height: 100%; background: #fff; border-radius: 2px; transition: width 0.2s ease; box-shadow: 0 0 8px rgba(255,255,255,0.6); position: relative; }
        .loader-thumb { position: absolute; right: -12px; top: 50%; transform: translateY(-50%); width: 26px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.8)); }
        .loader-thumb img { width: 100%; display: block; }
        .loader-percentage { color: #f43f5e; font-size: 0.8rem; font-weight: bold; margin-top: 12px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(244,63,94,0.5); }

        /* === 4. ANIMATIONS === */
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes webSplatAnim { 0% { transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.05) rotate(3deg); opacity: 0.6; } 60% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(0.9) rotate(0deg); opacity: 0; } }
        .web-splat { position: fixed; width: auto; pointer-events: none; z-index: 99998; transform: translate(-50%, -50%) scale(0.3); animation: webSplatAnim 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); opacity: 0.6; }
        
        @keyframes spideyEntryAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6) translateY(25px); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(1.04) translateY(-6px); } 80% { transform: translate(-50%, -50%) scale(0.97) translateY(2px); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0); } }
        @keyframes comicBadgePop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-20deg); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(6deg); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(0.92) rotate(-3deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); } }
        @keyframes textSmoothSlide { 0% { opacity: 0; transform: translateX(-50%) translateY(18px); letter-spacing: 4px; } 100% { opacity: 1; transform: translateX(-50%) translateY(0); letter-spacing: 1px; } }
        @keyframes spideySmoothSwing { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-3.8deg); } 75% { transform: rotate(3.8deg); } }
        @keyframes realisticPulseGlow { 0%, 100% { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(56,189,248,0.5)); } 50% { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.9)) drop-shadow(0 0 16px rgba(244,63,94,0.8)); } }
        @keyframes moonlightGlowEffect { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)) brightness(1.0); } 50% { filter: drop-shadow(0 0 22px rgba(255,255,255,0.95)) brightness(1.3); } }
        @keyframes s2BuildingFade { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes s2SpideyPop { 0% { opacity: 0; transform: scale(0.4) translateY(15px); } 70% { opacity: 1; transform: scale(1.08) translateY(-3px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes s2SpideySlide { 0% { opacity: 0; transform: translateX(-35px) scale(0.75); } 70% { opacity: 1; transform: translateX(5px) scale(1.03); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes s3FadeDown { 0% { opacity: 0; transform: translateY(-25px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes s3FadeUp { 0% { opacity: 0; transform: translateY(25px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes s3PopScale { 0% { opacity: 0; transform: scale(0.7) rotate(-5deg); } 70% { opacity: 1; transform: scale(1.04) rotate(2deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes s3SlideInLeft { 0% { opacity: 0; transform: translateX(-30px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes s3SlideInRight { 0% { opacity: 0; transform: translateX(30px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes s5Item2Anim { 0% { opacity: 0; transform: scale(0.7) translateY(-20px); } 70% { opacity: 1; transform: scale(1.03) translateY(4px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes s5Item2Stay { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
        @keyframes s5Item4Anim { 0% { opacity: 0; transform: scale(0.3) rotate(-15deg); } 70% { opacity: 1; transform: scale(1.15) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes s5Item4Stay { 0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); } 50% { transform: translateY(-7px) scale(1.06); filter: drop-shadow(0 10px 18px rgba(244,63,94,0.7)); } }

        /* === 5. CARD CONTAINER & SCREENS === */
        .card-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transform-origin: center center; width: 384px; height: 273px; background: radial-gradient(circle at 50% 40%, #16386d 0%, #0b1e3f 65%, #050d1f 100%); border-radius: 18px; z-index: 1; border: 1.5px solid rgba(255,255,255,0.45); box-shadow: 0 35px 80px rgba(0,0,0,0.95), inset 0 0 40px rgba(56,189,248,0.25), inset 0 0 20px rgba(244,63,94,0.2); overflow: hidden; display: grid; }
        .card-container::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 25%, rgba(56,189,248,0.22) 0%, rgba(244,63,94,0.12) 45%, transparent 75%); pointer-events: none; z-index: 1; }

        .screen { grid-area: 1 / 1 / 2 / 2; width: 100%; height: 100%; display: block; opacity: 0; visibility: hidden; pointer-events: none; transform: scale(0.92) translateY(25px) translateZ(0); will-change: transform, opacity, filter; transition: opacity 1.1s cubic-bezier(0.25,1,0.5,1), transform 1.1s cubic-bezier(0.25,1,0.5,1), filter 1.1s ease; overflow: hidden; z-index: 2; }
        .screen.active { opacity: 1; visibility: visible; pointer-events: auto; transform: scale(1) translateY(0) rotate(0deg) translateZ(0); filter: blur(0); z-index: 3; }
        .screen.exiting-zoom { opacity: 0; visibility: visible; transform: scale(1.18) translateZ(0); filter: blur(10px); z-index: 2; pointer-events: none; }
        .screen.exiting-slide { opacity: 0; visibility: visible; transform: translateX(-70px) scale(0.95) translateZ(0); filter: blur(4px); z-index: 2; pointer-events: none; }
        .screen.exiting-rotate { opacity: 0; visibility: visible; transform: scale(0.85) rotate(-6deg) translateZ(0); filter: blur(6px); z-index: 2; pointer-events: none; }

        /* === 6. SLIDE COMPONENTS & WIDGETS === */
        .s5-global-static { position: absolute; z-index: 2; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 0.5s ease; }
        .card-container.show-slide5-static .s5-global-static { opacity: 1; visibility: visible; }
        .s5-item1 { top: -20%; left: 0%; width: 99%; }
        .s5-item3 { bottom: -8%; left: 28%; width: 44%; z-index: 4; }

        #screen-1 { position: relative; }
        #screen-1.active { opacity: 1; visibility: visible; transform: none; filter: blur(0); z-index: 3; transition: none; }
        #screen-1.exiting-zoom { opacity: 0; visibility: visible; transform: scale(1.35) translateZ(0); filter: blur(16px); z-index: 2; pointer-events: none; transition: opacity 1.2s cubic-bezier(0.25,1,0.5,1), transform 1.2s cubic-bezier(0.25,1,0.5,1), filter 1.2s ease; }
        #screen-1 .s1-item1 { position: absolute; top: 0%; left: 0%; width: 28%; z-index: 2; pointer-events: none; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5)); transform: none !important; }
        #screen-1 .s1-item2 { position: absolute; bottom: -10%; left: -7%; width: 28%; z-index: 2; pointer-events: none; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)); transform: none !important; }
        #screen-1 .s1-item3 { position: absolute; top: 0%; right: -3%; width: 28%; z-index: 3; pointer-events: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.85)); transform: none !important; }
        #screen-1 .s1-item6 { position: absolute; bottom: -7%; right: -6%; width: 28%; z-index: 4; pointer-events: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); transform: none !important; }
        #screen-1 .s1-item4-container, #screen-1 .s1-spidey-container, #screen-1 .spidey-instruction-text { opacity: 0; }
        #screen-1.play-anim .s1-item4-container { position: absolute; top: 67%; left: 80%; transform: translate(-50%, -50%); width: 30%; z-index: 10; pointer-events: none; animation: comicBadgePop 0.85s cubic-bezier(0.175,0.885,0.32,1.275) 0.2s both; }
        #screen-1.play-anim .s1-item4 { width: 100%; display: block; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        #screen-1.play-anim .s1-spidey-container { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 50%; z-index: 4; pointer-events: none; animation: spideyEntryAnim 1.0s cubic-bezier(0.25,1,0.5,1) 0.05s both; }
        #screen-1.play-anim .s1-item5 { width: 100%; display: block; transform-origin: top center; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5)); animation: spideySmoothSwing 5.5s ease-in-out 1.1s infinite; }
        #screen-1.play-anim .spidey-instruction-text { position: absolute; top: 85%; left: 50%; transform: translateX(-50%); font-size: 0.75rem; font-weight: bold; color: #fff; text-align: center; white-space: nowrap; z-index: 5; pointer-events: none; letter-spacing: 1px; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 4px 8px rgba(0,0,0,0.9); animation: textSmoothSlide 0.9s cubic-bezier(0.25,1,0.5,1) 0.4s both; }
        .envelope-target { position: absolute; top: 25%; left: 30%; width: 40%; height: 50%; cursor: pointer; z-index: 6; }

        #screen-2 { position: relative; transition: none !important; }
        #screen-2.active { opacity: 1 !important; visibility: visible !important; transform: none !important; }
        #screen-2 .s2-item3 { position: absolute; top: 10%; left: 62%; width: 4%; z-index: 4; pointer-events: none; animation: moonlightGlowEffect 3.5s ease-in-out infinite; }
        #screen-2 .s2-item5 { position: absolute; inset: 0 auto auto 0; width: 100%; z-index: 1; pointer-events: none; }
        #screen-2 .s2-item1, #screen-2 .s2-item2, #screen-2 .s2-item4 { opacity: 0; }
        #screen-2.play-anim .s2-item1 { position: absolute; top: -33%; left: 0%; width: 100%; z-index: 2; pointer-events: none; animation: s2BuildingFade 0.9s ease 0.05s both; }
        #screen-2.play-anim .s2-item2 { position: absolute; top: 44%; right: 68%; width: 12%; z-index: 10; cursor: pointer; transition: all 0.6s cubic-bezier(0.34,1.56,0.64,1); animation: s2SpideyPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.15s both, realisticPulseGlow 3s ease-in-out 0.95s infinite; }
        #screen-2.play-anim .s2-item2:hover { transform: scale(1.12) translateY(-2px); filter: drop-shadow(0 12px 20px rgba(0,0,0,0.95)) drop-shadow(0 0 20px rgba(244,63,94,1)); }
        #screen-2.play-anim .s2-item4 { position: absolute; top: 60%; left: 55%; width: 40%; z-index: 5; pointer-events: none; animation: s2SpideySlide 0.85s cubic-bezier(0.25,1,0.5,1) 0.25s both; }

        #screen-3 { position: relative; }
        #screen-3.active { opacity: 1; visibility: visible; transform: none; filter: blur(0); z-index: 3; transition: none; }
        .songs-container { position: absolute; top: var(--songs-top); left: var(--songs-left); width: var(--songs-width); display: flex; flex-direction: column; z-index: 2; opacity: 0; }
        #screen-3.play-anim .songs-container { animation: s3PopScale 0.8s cubic-bezier(0.25,1,0.5,1) 0.1s both; }
        .song-widget + .song-widget { margin-top: var(--songs-gap); }
        
        .song-widget { display: flex; flex-direction: column; position: relative; pointer-events: none; }
        #songWidget1 { z-index: 2; }
        #songWidget2 { z-index: 1; }
        .song-widget.expanded { z-index: 10 !important; }
        
        .song-box-inner { position: relative; width: 100%; z-index: 5; pointer-events: none; }
        
        .box-hitbox {
            position: absolute;
            top: 2%;
            left: 2%;
            width: 96%;
            height: 70%;
            z-index: 10;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .s3-item1-img { width: 100%; display: block; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5)); pointer-events: none; }
        .song-info { position: absolute; top: 50%; left: 6%; transform: translateY(-50%); width: 62%; display: flex; flex-direction: column; justify-content: center; pointer-events: none; z-index: 11; }
        .song-title { font-size: 0.65rem; font-weight: bold; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.45rem; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

        .song-controls { 
            position: relative; z-index: 1; max-height: 0; opacity: 0; overflow: hidden; 
            visibility: hidden; pointer-events: none;
            width: var(--bar-width); margin-top: var(--bar-margin-top); margin-left: var(--bar-offset-x); 
            display: flex; align-items: center; gap: var(--bar-gap); 
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.95)); 
            backdrop-filter: blur(10px); padding: 0 10px; border-radius: 0 0 8px 8px; 
            border: 1px solid rgba(244,63,94,0.45); border-top: none; 
            box-shadow: 0 6px 16px rgba(0,0,0,0.7); 
            transition: max-height 0.35s cubic-bezier(0.25,1,0.5,1), opacity 0.25s ease, margin-top 0.3s cubic-bezier(0.25,1,0.5,1), padding 0.3s ease; 
        }
        .song-widget.expanded .song-controls { 
            max-height: var(--bar-height); opacity: 1; 
            visibility: visible; pointer-events: auto;
            margin-top: var(--bar-margin-top); padding: 6px 10px; 
        }

        .song-play-btn { background: linear-gradient(135deg, #f43f5e, #e11d48); border: none; border-radius: 50%; width: var(--bar-btn); height: var(--bar-btn); display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 6px rgba(244,63,94,0.6); transition: all 0.2s ease; }
        .song-play-btn:hover { transform: scale(1.12); box-shadow: 0 4px 10px rgba(244,63,94,0.85); }
        .song-play-btn svg { width: calc(var(--bar-btn) * 0.38); height: calc(var(--bar-btn) * 0.38); fill: #fff; }
        .song-progress-wrapper { flex-grow: 1; height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .song-progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #f43f5e); border-radius: 2px; box-shadow: 0 0 6px rgba(244,63,94,0.9); transition: width 0.1s linear; }
        .song-time { font-size: 0.55rem; color: #f1f5f9; min-width: 28px; text-align: right; flex-shrink: 0; font-weight: bold; }

        #screen-3 .s3-item2, #screen-3 .s3-item3, #screen-3 .s3-item4, #screen-3 .s3-item5, #screen-3 .s3-item6, #screen-3 .s3-item7 { opacity: 0; }
        .s3-item2 { position: absolute; top: -8%; left: 34%; width: 32%; z-index: 3; pointer-events: none; }
        #screen-3.play-anim .s3-item2 { animation: s3FadeDown 0.8s cubic-bezier(0.25,1,0.5,1) 0.05s both; }
        .s3-item3 { position: absolute; top: 10%; right: 9.5%; width: 18%; z-index: 3; pointer-events: none; }
        #screen-3.play-anim .s3-item3 { animation: s3SlideInRight 0.8s cubic-bezier(0.25,1,0.5,1) 0.15s both; }
        .s3-item4 { position: absolute; top: 20%; right: 47%; width: 53%; z-index: 3; pointer-events: none; }
        #screen-3.play-anim .s3-item4 { animation: s3FadeDown 0.9s cubic-bezier(0.25,1,0.5,1) 0.2s both; }
        .s3-item5 { position: absolute; bottom: 0%; left: 0%; width: 48%; z-index: 1; pointer-events: none; }
        #screen-3.play-anim .s3-item5 { animation: s3SlideInLeft 0.9s cubic-bezier(0.25,1,0.5,1) 0.25s both; }
        .s3-item6 { position: absolute; bottom: 0%; right: 0%; width: 48%; z-index: 1; pointer-events: none; }
        #screen-3.play-anim .s3-item6 { animation: s3SlideInRight 0.9s cubic-bezier(0.25,1,0.5,1) 0.25s both; }
        .s3-item7 { position: absolute; bottom: -9%; right: 14.5%; width: 71%; z-index: 1; pointer-events: none; }
        #screen-3.play-anim .s3-item7 { animation: s3FadeUp 0.9s cubic-bezier(0.25,1,0.5,1) 0.3s both; }
        .s3-next-btn { position: absolute; bottom: 14px; right: 18px; width: 34px; height: 34px; background: #fff; border: 2px solid #f43f5e; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 15; box-shadow: 0 4px 15px rgba(244,63,94,0.5), 0 2px 8px rgba(0,0,0,0.8); transition: all 0.25s ease; opacity: 0; }
        #screen-3.play-anim .s3-next-btn { animation: s3PopScale 0.8s cubic-bezier(0.25,1,0.5,1) 0.4s both; }
        .s3-next-btn:hover { transform: scale(1.15); background: #fdf2f4; }
        .s3-next-btn svg { width: 16px; height: 16px; stroke: #f43f5e; fill: none; }

        #screen-moment { position: relative; }
        #screen-moment .s4-item1, #screen-moment .s4-item2, #screen-moment .s4-item3, #screen-moment .s4-item4, #screen-moment .s4-item5, #screen-moment .paper-wrapper { opacity: 0; }
        #screen-moment.play-anim .s4-item1 { animation: s3FadeDown 0.8s cubic-bezier(0.25,1,0.5,1) 0.05s both; }
        #screen-moment.play-anim .s4-item2 { animation: s3FadeDown 0.8s cubic-bezier(0.25,1,0.5,1) 0.1s both; }
        #screen-moment.play-anim .s4-item3 { animation: s3SlideInLeft 0.8s cubic-bezier(0.25,1,0.5,1) 0.15s both; }
        #screen-moment.play-anim .s4-item4 { animation: s3SlideInRight 0.8s cubic-bezier(0.25,1,0.5,1) 0.2s both; }
        #screen-moment.play-anim .s4-item5 { animation: s3FadeUp 0.8s cubic-bezier(0.25,1,0.5,1) 0.25s both; }
        #screen-moment.play-anim .paper-wrapper { animation: s3FadeUp 0.8s cubic-bezier(0.25,1,0.5,1) 0.3s both; }
        .s4-item1 { position: absolute; top: 75%; left: 80%; width: 20%; z-index: 2; }
        .s4-item2 { position: absolute; top: -20%; right: 27.5%; width: 45%; z-index: 2; }
        .s4-item3 { position: absolute; top: -4.5%; left: -5%; width: 26%; z-index: 3; }
        .s4-item4 { position: absolute; top: 24%; right: 48.5%; width: 49.5%; z-index: 3; }
        .s4-item5 { position: absolute; bottom: 66%; left: 72%; width: 27%; z-index: 4; }

        .slide4-slider-container { position: absolute; bottom: 5px; right: 225px; width: 100px; height: 18px; z-index: 20; background: rgba(15,23,42,0.85); border: 1px solid rgba(244,63,94,0.5); border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.7), inset 0 0 8px rgba(244,63,94,0.2); backdrop-filter: blur(8px); display: flex; align-items: center; padding: 2px; user-select: none; }
        .slider-track { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slider-text { font-size: 0.42rem; color: rgba(255,255,255,0.75); letter-spacing: 0.5px; pointer-events: none; text-transform: lowercase; }
        .slider-thumb-btn { position: absolute; left: -1px; width: 20px; height: 20px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); touch-action: none; }

        .paper-wrapper { position: absolute; bottom: -2%; right: 6%; width: 71%; z-index: 1; }
        .paper-wrapper .s4-item6 { width: 100%; display: block; }
        .letter-container { position: absolute; top: var(--letter-top); left: var(--letter-left); width: var(--letter-width); height: var(--letter-height); z-index: 5; padding: 4px 6px; overflow-y: hidden; color: #3b2d28; font-size: var(--letter-size); line-height: var(--letter-line); text-align: justify; white-space: pre-line; word-wrap: break-word; }

        #screen-5 { position: relative; }
        .s5-item2 { position: absolute; top: 0%; left: 23%; width: 55%; z-index: 3; pointer-events: none; opacity: 0; }
        #screen-5.play-anim .s5-item2 { animation: s5Item2Anim 0.85s cubic-bezier(0.25,1,0.5,1) 0.1s both, s5Item2Stay 4s ease-in-out 0.95s infinite; }
        .s5-item4 { position: absolute; bottom: 73%; left: 47%; width: 9%; z-index: 5; opacity: 0; pointer-events: none; }
        #screen-5.play-anim .s5-item4 { animation: s5Item4Anim 0.8s cubic-bezier(0.175,0.885,0.32,1.275) 0.3s both, s5Item4Stay 3s ease-in-out 1.1s infinite; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loader-text">loading spidey card...</div>
            <div class="loader-bar-container">
                <div class="loader-bar" id="loaderBar">
                    <div class="loader-thumb"><img src="slide4_item1.png" alt="thumb" loading="lazy"></div>
                </div>
            </div>
            <div class="loader-percentage" id="loaderPercentage">0%</div>
        </div>
    </div>

    <canvas id="magic-canvas"></canvas>
    <audio id="bgMusic" src="beabadoobee-glue-song.mp3" preload="auto" loop></audio>

    <!-- MAIN CONTAINER -->
    <div class="card-container" id="mainCard">
        <img src="slide5_item1.png" class="s5-global-static s5-item1" loading="lazy">
        <img src="slide5_item3.png" class="s5-global-static s5-item3" loading="lazy">

        <!-- SCREEN 1 -->
        <div id="screen-1" class="screen">
            <img src="slide1_item1.png" class="s1-item1" loading="lazy">
            <img src="slide1_item2.png" class="s1-item2" loading="lazy">
            <img src="slide1_item3.png" class="s1-item3" loading="lazy">
            <div class="s1-item4-container"><img src="slide1_item4.png" class="s1-item4" loading="lazy"></div>
            <div class="s1-spidey-container"><img src="slide1_item5.png" class="s1-item5" loading="lazy"></div>
            <img src="slide1_item6.png" class="s1-item6" loading="lazy">
            <div class="spidey-instruction-text">Tekan Spiderman nya!!</div>
            <div class="envelope-target" onclick="openSurprise(); event.stopPropagation();"></div>
        </div>

        <!-- SCREEN 2 -->
        <div id="screen-2" class="screen">
            <img src="slide2_item1.png" class="s2-item1" loading="lazy">
            <img src="slide2_item2.png" id="slide2Spidey" class="s2-item2" onclick="handleSlide2SpideyClick(event); event.stopPropagation();" loading="lazy">
            <img src="slide2_item3.png" class="s2-item3" loading="lazy">
            <img src="slide2_item4.png" class="s2-item4" loading="lazy">
            <img src="slide2_item5.png" class="s2-item5" loading="lazy">
        </div>

        <!-- SCREEN 3 -->
        <div id="screen-3" class="screen">
            <div class="songs-container">
                
                <!-- Kotak Musik 1 (Taylor Swift) -->
                <div class="song-widget" id="songWidget1">
                    <div class="song-box-inner">
                        <div class="box-hitbox" onclick="toggleSongAccordion(1); event.stopPropagation();"></div>
                        <img src="slide3_item1.png" class="s3-item1-img" loading="lazy">
                        <div class="song-info">
                            <div class="song-title">Slut!</div>
                            <div class="song-artist">Taylor Swift</div>
                        </div>
                    </div>
                    <div class="song-controls" onclick="event.stopPropagation()">
                        <button class="song-play-btn" onclick="togglePlayAudio(1, event)">
                            <svg class="play-icon-svg" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
                            <svg class="pause-icon-svg" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
                        </button>
                        <div class="song-progress-wrapper" onclick="seekSong(event, 1)"><div class="song-progress-bar"></div></div>
                        <div class="song-time">0:00</div>
                    </div>
                    <audio id="songAudio1" src="Taylor Swift - Slut.mp3" preload="auto"></audio>
                </div>

                <!-- Kotak Musik 2 (Westlife) -->
                <div class="song-widget" id="songWidget2">
                    <div class="song-box-inner">
                        <div class="box-hitbox" onclick="toggleSongAccordion(2); event.stopPropagation();"></div>
                        <img src="slide3_item1.png" class="s3-item1-img" loading="lazy">
                        <div class="song-info">
                            <div class="song-title">I Lay My Love on You</div>
                            <div class="song-artist">Westlife</div>
                        </div>
                    </div>
                    <div class="song-controls" onclick="event.stopPropagation()">
                        <button class="song-play-btn" onclick="togglePlayAudio(2, event)">
                            <svg class="play-icon-svg" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
                            <svg class="pause-icon-svg" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
                        </button>
                        <div class="song-progress-wrapper" onclick="seekSong(event, 2)"><div class="song-progress-bar"></div></div>
                        <div class="song-time">0:00</div>
                    </div>
                    <audio id="songAudio2" src="Westlife - I Lay My Love on You.mp3" preload="auto"></audio>
                </div>

            </div>

            <img src="slide3_item2.png" class="s3-item2" loading="lazy">
            <img src="slide3_item3.png" class="s3-item3" loading="lazy">
            <img src="slide3_item4.png" class="s3-item4" loading="lazy">
            <img src="slide3_item5.png" class="s3-item5" loading="lazy">
            <img src="slide3_item6.png" class="s3-item6" loading="lazy">
            <img src="slide3_item7.png" class="s3-item7" loading="lazy">

            <div class="s3-next-btn" onclick="goToScreen('screen-moment', 'slide'); event.stopPropagation();">
                <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
        </div>

        <!-- SCREEN MOMENT -->
        <div id="screen-moment" class="screen">
            <img src="slide4_item1.png" class="s4-item1" loading="lazy">
            <img src="slide4_item2.png" class="s4-item2" loading="lazy">
            <img src="slide4_item3.png" class="s4-item3" loading="lazy">
            <img src="slide4_item4.png" class="s4-item4" loading="lazy">
            <img src="slide4_item5.png" class="s4-item5" loading="lazy">
            
            <div class="slide4-slider-container">
                <div class="slider-track">
                    <span class="slider-text">geser &gt;&gt;</span>
                    <div class="slider-thumb-btn" id="slide4Thumb">
                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </div>

            <div class="paper-wrapper">
                <img src="slide4_item6.png" class="s4-item6" loading="lazy">
                <div class="letter-container"><div id="letterText"></div></div>
            </div>
        </div>

        <!-- SCREEN 5 -->
        <div id="screen-5" class="screen">
            <img src="slide5_item2.png" class="s5-item2" loading="lazy">
            <img src="slide5_item4.png" class="s5-item4" loading="lazy">
        </div>
    </div>

    <!-- SCRIPT SECTION -->
    <script>
        const letterMessage = `Hai, Rey. 
        Aku mungkin jarang bilang ini, tapi aku bersyukur banget ada kamu di hidupku. Dari obrolan random, candaan konyol, sampai momen-momen sederhana yang kelihatannya biasa aja, semuanya berarti banget buat aku. Kita nggak tahu masa depan bakal bawa kita ke mana, tapi aku harap kita akan selalu nemuin jalan buat saling nemenin, di hari baik maupun buruk. Happy boyfriend day, sayang. Terima kasih udah jadi kamu. 🤍 
        — Erin`;

        let typingTimeout = null;
        let typingSessionId = 0;
        let globalCardScale = 1;

        // === 1. RESPONSIVE SCALE MANAGER (MENTOK ATAS-BAWAH DI LAPTOP) ===
        function applyDynamicScale() {
            const card = document.getElementById('mainCard');
            const loader = document.querySelector('.loader-content');
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            if (w > h) {
                globalCardScale = h / 273;
            } else {
                globalCardScale = w / 384;
            }
            
            if(card) card.style.transform = `translate(-50%, -50%) scale(${globalCardScale})`;
            if(loader) loader.style.transform = `scale(${globalCardScale})`;
        }
        window.addEventListener('resize', applyDynamicScale);
        applyDynamicScale();

        // === 2. TYPING EFFECT ===
        function startTypingEffect() {
            const el = document.getElementById('letterText');
            if (!el) return;
            typingSessionId++;
            const currentSession = typingSessionId;
            if (typingTimeout) { clearTimeout(typingTimeout); typingTimeout = null; }
            el.textContent = '';
            let i = 0;
            function type() {
                if (currentSession !== typingSessionId) return;
                if (i < letterMessage.length) {
                    el.textContent += letterMessage.charAt(i);
                    i++;
                    typingTimeout = setTimeout(type, 20);
                }
            }
            setTimeout(type, 450);
        }

        // === 3. ASSET LOADER (MENUNGGU SEMUA ITEM SELESAI) ===
        window.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('img');
            const loaderBar = document.getElementById('loaderBar');
            const loaderPercentage = document.getElementById('loaderPercentage');
            const loadingScreen = document.getElementById('loading-screen');
            let totalAssets = images.length, loadedAssets = 0, isFinished = false;

            function finishLoading() {
                if (isFinished) return;
                isFinished = true;
                if (loadingScreen) {
                    loadingScreen.classList.add('fade-out');
                    const screen1 = document.getElementById('screen-1');
                    const mainCard = document.getElementById('mainCard');
                    if (screen1) {
                        screen1.classList.remove('play-anim');
                        void screen1.offsetWidth;
                        screen1.classList.add('active', 'play-anim');
                    }
                    if (mainCard) mainCard.classList.remove('show-slide5-static');
                    history.replaceState({ screen: 'screen-1', transition: 'zoom' }, '', '');
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
                }
            }

            function updateProgress() {
                if (isFinished) return;
                loadedAssets++;
                let percentage = Math.min(100, Math.floor((loadedAssets / Math.max(1, totalAssets)) * 100));
                if (loaderBar) loaderBar.style.width = percentage + '%';
                if (loaderPercentage) loaderPercentage.innerText = percentage + '%';
                if (loadedAssets >= totalAssets) {
                    setTimeout(finishLoading, 300);
                }
            }

            if (totalAssets === 0) {
                setTimeout(finishLoading, 300);
                return;
            }

            images.forEach(img => {
                if (img.complete) {
                    updateProgress();
                } else {
                    img.addEventListener('load', updateProgress, { once: true });
                    img.addEventListener('error', updateProgress, { once: true });
                }
            });
        });

        // === 4. SCREEN NAVIGATION & CONSISTENT ANIMATION RESET ===
        function goToScreen(screenId, transitionType = 'zoom', pushHistory = true) {
            const currentActive = document.querySelector('.screen.active');
            const targetScreen = document.getElementById(screenId);
            if (!currentActive || currentActive === targetScreen) return;

            const mainCard = document.getElementById('mainCard');
            if (screenId === 'screen-5') mainCard.classList.add('show-slide5-static');
            else mainCard.classList.remove('show-slide5-static');

            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active', 'play-anim', 'exiting-zoom', 'exiting-slide', 'exiting-rotate');
            });

            void targetScreen.offsetWidth;

            let exitClass = 'exiting-zoom';
            if (transitionType === 'slide') exitClass = 'exiting-slide';
            if (transitionType === 'rotate') exitClass = 'exiting-rotate';

            currentActive.classList.add(exitClass);
            targetScreen.classList.add('active', 'play-anim');

            if (screenId === 'screen-moment') startTypingEffect();
            if (pushHistory) history.pushState({ screen: screenId, transition: transitionType }, '', '');
            
            setTimeout(() => { 
                currentActive.classList.remove(exitClass); 
            }, 1200);
        }

        window.addEventListener('popstate', (event) => {
            const targetScreenId = event.state && event.state.screen ? event.state.screen : 'screen-1';
            const transition = event.state && event.state.transition ? event.state.transition : 'slide';
            goToScreen(targetScreenId, transition, false);
            if (targetScreenId === 'screen-moment') startTypingEffect();
        });

        function openSurprise() {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.play().catch(e => console.log("Autoplay error:", e));
            const audio1 = songAudios[1];
            const widget1 = document.getElementById('songWidget1');
            const playSvg1 = widget1.querySelector('.play-icon-svg');
            const pauseSvg1 = widget1.querySelector('.pause-icon-svg');

            bgMusic.volume = 0.1;
            audio1.load();
            audio1.play().then(() => {
                playSvg1.style.display = 'none';
                pauseSvg1.style.display = 'block';
            }).catch(() => { bgMusic.volume = 1.0; });
            goToScreen('screen-2', 'zoom');
        }

        // === 5. SLIDER CONTROLS (LOCKSCREEN) ===
        const sliderThumb = document.getElementById('slide4Thumb');
        if (sliderThumb) {
            let isDragging = false, startX = 0, currentX = 0;
            const maxTranslate = 75;

            sliderThumb.addEventListener('pointerdown', (e) => {
                isDragging = true; startX = e.clientX;
                sliderThumb.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });
            sliderThumb.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                currentX = (e.clientX - startX) / globalCardScale; 
                currentX = Math.max(0, Math.min(currentX, maxTranslate));
                sliderThumb.style.transform = `translateX(${currentX}px)`;
                e.stopPropagation();
            });
            sliderThumb.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                sliderThumb.releasePointerCapture(e.pointerId);
                if (currentX >= maxTranslate * 0.75) goToScreen('screen-5', 'slide');
                sliderThumb.style.transition = 'transform 0.3s ease';
                sliderThumb.style.transform = 'translateX(0px)';
                setTimeout(() => { sliderThumb.style.transition = 'none'; currentX = 0; }, 300);
                e.stopPropagation();
            });
        }

        // === 6. AUDIO & SONG PLAYER (ACCORDION) ===
        const songAudios = [null, document.getElementById('songAudio1'), document.getElementById('songAudio2')];

        function toggleSongAccordion(index) {
            const widget = document.getElementById(`songWidget${index}`);
            const isAlreadyExpanded = widget.classList.contains('expanded');
            document.querySelectorAll('.song-widget').forEach(w => w.classList.remove('expanded'));
            if (!isAlreadyExpanded) widget.classList.add('expanded');
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            return `${Math.floor(seconds / 60)}:${Math.floor(seconds % 60) < 10 ? '0' : ''}${Math.floor(seconds % 60)}`;
        }

        function togglePlayAudio(index, event) {
            if (event) event.stopPropagation();
            const audio = songAudios[index];
            const widget = document.getElementById(`songWidget${index}`);
            const playSvg = widget.querySelector('.play-icon-svg');
            const pauseSvg = widget.querySelector('.pause-icon-svg');
            const bgMusic = document.getElementById('bgMusic');

            for (let i = 1; i <= 2; i++) {
                if (i !== index && songAudios[i] && !songAudios[i].paused) {
                    songAudios[i].pause();
                    const w = document.getElementById(`songWidget${i}`);
                    w.querySelector('.play-icon-svg').style.display = 'block';
                    w.querySelector('.pause-icon-svg').style.display = 'none';
                }
            }

            if (audio.paused) {
                bgMusic.volume = 0.1;
                audio.load();
                audio.play().then(() => {
                    playSvg.style.display = 'none'; pauseSvg.style.display = 'block';
                }).catch(() => {});
            } else {
                audio.pause();
                bgMusic.volume = 1.0;
                playSvg.style.display = 'block'; pauseSvg.style.display = 'none';
            }
        }

        function seekSong(event, index) {
            event.stopPropagation();
            const audio = songAudios[index];
            if (!audio.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            audio.currentTime = ((event.clientX - rect.left) / rect.width) * audio.duration;
        }

        [1, 2].forEach(index => {
            const audio = songAudios[index];
            if (audio) {
                audio.addEventListener('timeupdate', () => {
                    const widget = document.getElementById(`songWidget${index}`);
                    if (audio.duration) {
                        widget.querySelector('.song-progress-bar').style.width = (audio.currentTime / audio.duration) * 100 + '%';
                        widget.querySelector('.song-time').textContent = formatTime(audio.currentTime);
                    }
                });
                audio.addEventListener('ended', () => {
                    const widget = document.getElementById(`songWidget${index}`);
                    widget.querySelector('.play-icon-svg').style.display = 'block';
                    widget.querySelector('.pause-icon-svg').style.display = 'none';
                    document.getElementById('bgMusic').volume = 1.0;
                });
            }
        });

        // === 7. SLIDE 2 SPIDERMAN INTERACTION ===
        let slide2ClickCount = 0;
        function handleSlide2SpideyClick(event) {
            const spidey = document.getElementById('slide2Spidey');
            if (!spidey) return;
            slide2ClickCount++;
            spidey.style.transform = 'scale(0.85) rotate(-8deg)';
            setTimeout(() => {
                if (slide2ClickCount === 1) {
                    spidey.style.top = '45%'; spidey.style.right = '22%'; spidey.style.transform = 'scale(1) rotate(5deg)';
                } else if (slide2ClickCount === 2) {
                    spidey.style.top = '70%'; spidey.style.right = '58%'; spidey.style.transform = 'scale(0.95) rotate(-5deg)';
                } else if (slide2ClickCount >= 3) {
                    goToScreen('screen-3', 'slide');
                    setTimeout(() => {
                        slide2ClickCount = 0; spidey.style.top = '44%'; spidey.style.right = '68%'; spidey.style.transform = 'scale(1) rotate(0deg)';
                    }, 1000);
                }
            }, 120);
        }

        // === 8. WEB SPLAT & CANVAS BACKGROUND SYSTEM ===
        function createWebSplat(x, y) {
            const splat = document.createElement('img');
            splat.src = 'slide1_item2.png';
            splat.className = 'web-splat';
            splat.style.left = `${x}px`;
            splat.style.top = `${y}px`;
            splat.style.width = `${Math.round(24 * globalCardScale)}px`;
            document.body.appendChild(splat);
            setTimeout(() => splat.remove(), 500);
        }
        document.addEventListener('click', (event) => { createWebSplat(event.clientX, event.clientY); });

        const canvas = document.getElementById('magic-canvas');
        const ctx = canvas.getContext('2d');
        let isPageActive = true, time = 0;
        let mouse = { x: null, y: null };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        document.addEventListener("visibilitychange", () => { isPageActive = document.visibilityState === "visible"; });

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateContinuousWeb() {
            if (isPageActive) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                time += 0.015;
                let cx = canvas.width / 2, cy = canvas.height / 2;
                ctx.lineWidth = 1;
                let rows = 10, cols = 16, cellW = canvas.width / cols, cellH = canvas.height / rows;

                for (let r = 0; r <= rows; r++) {
                    ctx.beginPath();
                    for (let c = 0; c <= cols; c++) {
                        let x = c * cellW, y = r * cellH;
                        let finalY = y + Math.sin(time + c * 0.5 + r * 0.5) * 15;
                        if (mouse.x !== null && mouse.y !== null) {
                            let dist = Math.sqrt(Math.pow(x - mouse.x, 2) + Math.pow(finalY - mouse.y, 2));
                            if (dist < 200) finalY += (mouse.y - finalY) * (1 - dist / 200) * 0.3;
                        }
                        if (c === 0) ctx.moveTo(x, finalY); else ctx.lineTo(x, finalY);
                    }
                    ctx.strokeStyle = r % 2 === 0 ? 'rgba(14,165,233,0.1)' : 'rgba(244,63,94,0.1)';
                    ctx.stroke();
                }

                for (let c = 0; c <= cols; c++) {
                    ctx.beginPath();
                    for (let r = 0; r <= rows; r++) {
                        let waveX = (c * cellW) + Math.cos(time + r * 0.4) * 10;
                        let y = r * cellH;
                        if (r === 0) ctx.moveTo(waveX, y); else ctx.lineTo(waveX, y);
                    }
                    ctx.strokeStyle = c % 2 === 0 ? 'rgba(14,165,233,0.08)' : 'rgba(244,163,94,0.08)';
                    ctx.stroke();
                }

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(time * 0.2);
                for (let i = 1; i <= 5; i++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, i * 120, 0, Math.PI * 2);
                    ctx.strokeStyle = i % 2 === 0 ? 'rgba(14,165,233,0.12)' : 'rgba(244,63,94,0.12)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
                ctx.restore();
            }
            requestAnimationFrame(animateContinuousWeb);
        }
        animateContinuousWeb();
    </script>
</body>
